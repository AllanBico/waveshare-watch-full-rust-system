[package]
name = "firmware"
version.workspace = true
edition.workspace = true

[features]
default = []
logging = []
trace = []

[dependencies]
common = { path = "../crates/common" }
alarms = { path = "../crates/alarms" }
apps = { path = "../crates/apps" }
shell = { path = "../crates/shell" }
hal = { path = "../crates/hal" }
power = { path = "../crates/power" }
drivers = { path = "../drivers", features = ["hardware"] }
ui = { path = "../crates/ui" }
storage = { path = "../crates/storage" }
settings = { path = "../crates/settings" }
logging = { path = "../crates/logging" }
voice = { path = "../crates/voice" }
static_cell = "2.1"
embedded-hal = { workspace = true }
embedded-hal-bus = "0.3"

esp-hal = { version = "1.1.2", default-features = true, features = ["esp32s3", "unstable"] }
esp-metadata-generated = "0.4.0"
esp-rtos = { version = "0.3.0", features = ["esp32s3", "embassy", "esp-radio", "esp-alloc"] }
esp-sync = { version = "0.2.1", features = ["esp32s3"] }
esp-alloc = "0.10.0"
esp-radio = { version = "0.18.0", features = ["esp32s3", "wifi", "ble", "coex", "unstable"] }
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
esp-println = { version = "0.16.1", features = ["esp32s3"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-sync = "0.7"
embassy-sync08 = { package = "embassy-sync", version = "0.8" }
embassy-futures = "0.1"
embassy-net = { version = "0.8.0", default-features = false, features = ["dhcpv4", "medium-ethernet"] }
trouble-host = { version = "0.6.0", features = ["default-packet-pool-mtu-255", "derive", "scan"] }
