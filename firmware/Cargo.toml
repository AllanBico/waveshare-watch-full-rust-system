[package]
name = "firmware"
version.workspace = true
edition.workspace = true

[features]
default = []
logging = []
trace = []
simulator = []

[dependencies]
common = { path = "../crates/common" }
apps = { path = "../crates/apps" }
shell = { path = "../crates/shell" }
hal = { path = "../crates/hal" }
power = { path = "../crates/power" }
drivers = { path = "../drivers", features = ["hardware"] }
ui = { path = "../crates/ui" }
storage = { path = "../crates/storage" }
logging = { path = "../crates/logging" }
static_cell = "2.1"
embedded-hal = { workspace = true }
embedded-hal-bus = "0.3"

esp-hal = { version = "1.0.0", default-features = true, features = ["esp32s3", "unstable", "psram"] }
esp-rtos = { version = "0.2.0", features = ["esp32s3", "embassy"] }
esp-alloc = "0.9.0"
allocator-api2 = { version = "0.3", default-features = false, features = ["alloc"] }
esp-println = { version = "0.16.1", features = ["esp32s3"] }
esp-backtrace = { version = "0.18.1", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32s3"] }

embassy-executor = "0.9.0"
embassy-time = "0.5.1"
