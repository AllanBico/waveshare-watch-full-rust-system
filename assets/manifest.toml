# Asset sources for the in-house UI engine.
# Regenerate with: tools/gen-assets.sh
# Verify with:     tools/gen-assets.sh --check

[[font]]
id = "ui"
weight = "regular"
path = "fonts/sora/Sora-Regular.ttf"
sizes = [22, 28, 48]
charset = "ui"

[[font]]
id = "ui"
weight = "medium"
path = "fonts/sora/Sora-Medium.ttf"
sizes = [24, 36]
charset = "ui"

[[font]]
id = "numeric"
weight = "medium"
path = "fonts/jetbrains_mono/JetBrainsMono-Medium.ttf"
sizes = [72]
charset = "numeric"

