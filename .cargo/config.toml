# Target the ESP32-S3 by default. The simulator overrides this with
# `--target x86_64-unknown-linux-gnu`.
[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"

# The esp toolchain ships no precompiled `core` for Xtensa, so build it.
[unstable]
build-std = ["core"]
