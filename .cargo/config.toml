# Target the ESP32-S3 by default.
[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --partition-table partitions.csv"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

# The esp toolchain ships no precompiled core/alloc for Xtensa, so build them.
[unstable]
build-std = ["core", "alloc"]

[env]
# The board uses octal PSRAM (ESP32-S3R8).
ESP_HAL_CONFIG_PSRAM_MODE = "octal"

# Host unit tests run via `./tools/test-host.sh`. They must use the stable
# toolchain: it ignores `build-std`, while the esp toolchain would rebuild
# `core` and clash with the host's prebuilt std. A cargo alias cannot switch
# toolchains, so a small script does it instead.
