[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/hal",
    "crates/power",
    "crates/storage",
    "crates/ui",
    "crates/apps",
    "crates/voice",
    "crates/sync",
    "crates/logging",
    "drivers",
    "firmware",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
defmt = "1.2"
embedded-hal = "1.0"

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
